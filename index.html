<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question 👀</title>

<style>
    body{
        margin:0;
        padding:0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#ff9ec4,#ffd6e7);
        overflow:hidden;
        text-align:center;
    }

    .box{
        margin-top:120px;
    }

    h1{
        font-size:40px;
        color:white;
    }

    p{
        color:white;
        font-size:20px;
        padding:0 20px;
    }

    button{
        padding:14px 28px;
        border:none;
        border-radius:12px;
        font-size:18px;
        cursor:pointer;
        position:absolute;
        transition:0.2s;
    }

    /* YES BUTTON */
    #yes{
        background:#00b894;
        color:white;
        left:25%;
        top:65%;
    }

    /* NO BUTTON */
    #no{
        background:#ff3b6b;
        color:white;
        left:65%;
        top:65%;
    }

    #message{
        display:none;
        position:fixed;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        background:white;
        color:#ff3b6b;
        padding:30px;
        border-radius:20px;
        width:300px;
        box-shadow:0 0 20px rgba(0,0,0,0.3);
        font-size:24px;
        animation: pop 0.4s ease;
    }

    @keyframes pop{
        from{
            transform:translate(-50%,-50%) scale(0.5);
            opacity:0;
        }
        to{
            transform:translate(-50%,-50%) scale(1);
            opacity:1;
        }
    }
</style>
</head>

<body>

<div class="box">
    <h1>HEY MRS. CHILL PILL 😌</h1>

    <p>
        You have been selected for a very important mission 🚨<br><br>
        Will you officially continue being my favorite human forever? 😂❤️
    </p>

    <button id="yes">Yes Obviously 😎</button>
    <button id="no">No 😏</button>
</div>

<div id="message">
    😂 I knew itttt!!<br><br>

    Congratulations 🎉<br><br>

    You are now permanently hired as:<br><br>

    <b>My Favorite Person 💖</b>
</div>

<script>

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const message = document.getElementById("message");

function moveButton(){

    const maxX = window.innerWidth - noBtn.offsetWidth - 20;
    const maxY = window.innerHeight - noBtn.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

noBtn.addEventListener("click", function(e){
    e.preventDefault();
    moveButton();
});

yesBtn.addEventListener("click", function(){
    message.style.display = "block";
});

</script>

</body>
</html>
